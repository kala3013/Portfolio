<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16"/>
      <stop offset="100%" stop-color="#111A2E"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background with subtle border -->
  <rect width="64" height="64" rx="14" fill="url(#bgGrad)"/>
  <rect x="1" y="1" width="62" height="62" rx="13" stroke="url(#cyanGrad)" stroke-width="1.5" stroke-opacity="0.6"/>
  
  <!-- Geometric "K" / Terminal Node Monogram -->
  <g filter="url(#glow)">
    <!-- Vertical stem -->
    <path d="M20 18V46" stroke="url(#cyanGrad)" stroke-width="4.5" stroke-linecap="round"/>
    <!-- Diagonal arms of K -->
    <path d="M38 20L22 32L38 44" stroke="url(#cyanGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Code prompt dot -->
    <circle cx="44" cy="42" r="3" fill="#06B6D4"/>
  </g>
</svg>
