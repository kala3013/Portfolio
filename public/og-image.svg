<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <defs>
    <linearGradient id="ogBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070A12"/>
      <stop offset="50%" stop-color="#0B1120"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.9"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.75" stroke-opacity="0.5"/>
    </pattern>
    <filter id="glowEffect" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="60" result="blur"/>
    </filter>
  </defs>

  <!-- Base Canvas -->
  <rect width="1200" height="630" fill="url(#ogBg)"/>
  
  <!-- Ambient Glow Orbs -->
  <circle cx="200" cy="150" r="180" fill="#06B6D4" fill-opacity="0.12" filter="url(#glowEffect)"/>
  <circle cx="1050" cy="450" r="220" fill="#6366F1" fill-opacity="0.14" filter="url(#glowEffect)"/>
  
  <!-- Subtle Grid -->
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Top Status Badge -->
  <g transform="translate(100, 80)">
    <rect width="270" height="40" rx="20" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <circle cx="24" cy="20" r="5" fill="#10B981"/>
    <text x="42" y="25" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" letter-spacing="1">AVAILABLE FOR OPPORTUNITIES</text>
  </g>

  <!-- Candidate Identity -->
  <text x="100" y="200" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="800" letter-spacing="-1">
    KALANIDHI M C
  </text>
  <text x="100" y="260" fill="url(#textGrad)" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="700">
    Full Stack Developer • B.E. Computer Science
  </text>

  <!-- Positioning Subtitle -->
  <text x="100" y="320" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="400" width="800">
    Building practical web applications with React, Node.js, and SQL while exploring AI, Cloud &amp; DevOps.
  </text>

  <!-- Badges / Metrics Row -->
  <g transform="translate(100, 380)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="220" height="48" rx="10" fill="url(#cardGrad)" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.4"/>
    <text x="24" y="29" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="16" font-weight="600">⚡ Full Stack Engineering</text>

    <!-- Pill 2 -->
    <rect x="236" y="0" width="200" height="48" rx="10" fill="url(#cardGrad)" stroke="#818CF8" stroke-width="1" stroke-opacity="0.4"/>
    <text x="260" y="29" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="16" font-weight="600">🤖 AI &amp; Generative AI</text>

    <!-- Pill 3 -->
    <rect x="452" y="0" width="220" height="48" rx="10" fill="url(#cardGrad)" stroke="#34D399" stroke-width="1" stroke-opacity="0.4"/>
    <text x="476" y="29" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="16" font-weight="600">💼 Full Stack Internship</text>

    <!-- Pill 4 -->
    <rect x="688" y="0" width="220" height="48" rx="10" fill="url(#cardGrad)" stroke="#F59E0B" stroke-width="1" stroke-opacity="0.4"/>
    <text x="712" y="29" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="16" font-weight="600">🏆 Hackathon Finalist</text>
  </g>

  <!-- Footer Info Line -->
  <g transform="translate(100, 520)">
    <line x1="0" y1="0" x2="1000" y2="0" stroke="#334155" stroke-opacity="0.6"/>
    <text x="0" y="40" fill="#64748B" font-family="system-ui, monospace" font-size="16">
      Anna University Regional Campus, Coimbatore | 2023–2027
    </text>
    <text x="1000" y="40" fill="#38BDF8" font-family="system-ui, monospace" font-size="16" text-anchor="end">
      kalanidhimurugan@gmail.com • github.com/kala3013
    </text>
  </g>
</svg>
